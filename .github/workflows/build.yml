name: Tests e instalador de Windows

# - En cada push a main: tests.
# - Instalador de Windows publicado en Releases: al lanzar el workflow a mano (pestaña Actions)
#   o al hacer push a main con "[release]" en el mensaje del commit. La versión sale de package.json.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  windows:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]')
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist:win
      - name: Versión
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: Finanzas-instalador-windows
          path: release/*.exe
          if-no-files-found: error
      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Finanzas ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          fail_on_unmatched_files: true
          body: |
            Instalador de Finanzas para Windows (x64).
            La app instalada se actualiza sola a partir de la 0.3.0. Para instalarla por primera vez, descarga `Finanzas-Setup-${{ steps.version.outputs.version }}.exe` y ejecútalo. Si Windows muestra "Windows protegió su PC", pulsa "Más información" y "Ejecutar de todas formas" (el instalador no está firmado).
