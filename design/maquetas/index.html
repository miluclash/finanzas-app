<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Finanzas · maquetas de diseño</title>
    <link rel="icon" href="data:," />
    <script>
      // Tema antes de pintar: ?tema=dark|light|sistema > guardado > oscuro
      ;(function () {
        var q = new URLSearchParams(location.search).get('tema')
        var pref = q || localStorage.getItem('maquetas-tema') || 'dark'
        var dark = pref === 'dark' || (pref === 'sistema' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
