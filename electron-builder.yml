appId: com.miluclash.finanzas
productName: Finanzas
copyright: Uso personal
directories:
  buildResources: resources
  output: release
files:
  - out/**
  - package.json
extraResources:
  - from: resources/icon.png
    to: icon.png
# El servidor MCP se ejecuta con Node fuera de la app: necesita sus archivos sin comprimir en app.asar
asarUnpack:
  - out/mcp/**
  - node_modules/sql.js/**
npmRebuild: false
win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/icon.ico
  artifactName: Finanzas-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Finanzas
  deleteAppDataOnUninstall: false
  runAfterFinish: true
linux:
  target: [dir]
  icon: resources/icon.png
publish:
  provider: github
  owner: miluclash
  repo: finanzas-app
  releaseType: release
